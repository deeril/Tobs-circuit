<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Droplag — Animated Intro UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #141414;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Custom Wordmark Typography matching Droplag brand */
    .droplag-logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      letter-spacing: -0.045em;
    }

    /* Staggered Entrance Animations */
    @keyframes fadeSlideDown {
      0% { opacity: 0; transform: translateY(-18px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(22px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleInScene {
      0% { opacity: 0; transform: scale(0.92) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes floatPin {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes palmSway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(3.5deg); }
    }

    @keyframes roadFlow {
      to { stroke-dashoffset: -40; }
    }

    @keyframes vehicleBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.5px); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.06); }
    }

    .anim-logo {
      animation: fadeSlideDown 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .anim-scene {
      opacity: 0;
      animation: scaleInScene 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.18s forwards;
    }
    .anim-copy {
      opacity: 0;
      animation: fadeSlideUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
    }
    .anim-cta {
      opacity: 0;
      animation: fadeSlideUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    .pin-float-1 { animation: floatPin 3.2s ease-in-out infinite; }
    .pin-float-2 { animation: floatPin 3.6s ease-in-out 0.6s infinite; }
    .pin-float-3 { animation: floatPin 3.0s ease-in-out 1.1s infinite; }
    .pin-float-4 { animation: floatPin 3.4s ease-in-out 1.5s infinite; }

    .palm-sway-left {
      transform-origin: 42px 212px;
      animation: palmSway 4.2s ease-in-out infinite;
    }
    .palm-sway-right {
      transform-origin: 332px 238px;
      animation: palmSway 4.6s ease-in-out 0.8s infinite;
    }

    .road-dash-anim {
      stroke-dasharray: 12 10;
      animation: roadFlow 1.1s linear infinite;
    }

    .car-motion {
      animation: vehicleBob 1.9s ease-in-out infinite;
    }
    .bike-motion {
      animation: vehicleBob 1.4s ease-in-out 0.3s infinite;
    }

    .ambient-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .text-transition {
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
  </style>
</head>
<body class="bg-[#2c2c2c] text-white select-none">

  <!-- Mobile Device Frame -->
  <div id="phone-frame" class="relative w-full max-w-[395px] h-[100dvh] sm:h-[835px] sm:rounded-[48px] sm:border-[9px] sm:border-[#1f1f1f] bg-[#111111] overflow-hidden shadow-[0_30px_90px_rgba(0,0,0,0.65)] flex flex-col justify-between">

    <!-- Dynamic Island Notch & Status Bar -->
    <div class="pt-3 px-7 flex items-center justify-between text-[11px] font-semibold text-white/80 z-20">
      <span>9:41</span>
      <div class="w-[104px] h-[27px] bg-black rounded-full border border-white/5 flex items-center justify-end px-3">
        <span class="w-2.5 h-2.5 rounded-full bg-[#1a1a2e] ring-1 ring-white/10"></span>
      </div>
      <div class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M2 18h20v2H2v-2zm2.5-3h15v2h-15v-2zm3-3h9v2h-9v-2zm3-3h3v2h-3V9z"/></svg>
        <div class="w-5 h-2.5 rounded-[3px] border border-white/60 p-[1px] flex items-center">
          <div class="w-full h-full bg-white rounded-[1px]"></div>
        </div>
      </div>
    </div>

    <!-- ==================== MAIN INTRO ONBOARDING SCREEN ==================== -->
    <div id="intro-screen" class="flex-1 flex flex-col justify-between px-6 pt-5 pb-7 relative">

      <!-- Subtle Orange Radial Ambient Glow -->
      <div class="ambient-glow absolute top-[18%] left-1/2 -translate-x-1/2 w-[310px] h-[310px] rounded-full bg-[#ff5a00]/15 blur-[65px] pointer-events-none"></div>

      <!-- 1. Bold Modern Wordmark Header -->
      <header class="anim-logo flex items-center justify-center pt-1 relative z-10">
        <div class="droplag-logo text-[36px] leading-none flex items-center tracking-tight">
          <span class="text-white">Drop</span><span class="text-[#ff5a00]">lag</span>
        </div>
        <!-- Replay Intro Micro-Button -->
        <button onclick="replayIntroAnimation()" title="Replay Intro Animation" class="absolute right-0 w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white/60 hover:text-white transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M4 9a8 8 0 0114.9-2M20 15a8 8 0 01-14.9 2"/>
          </svg>
        </button>
      </header>

      <!-- 2. Animated 3D-Style Lagos Cable Bridge & Mobility Illustration -->
      <div class="anim-scene relative w-full my-auto flex items-center justify-center">
        <svg viewBox="0 0 380 285" class="w-full h-auto overflow-visible">
          <defs>
            <linearGradient id="roadSurface" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2c2e33"/>
              <stop offset="50%" stop-color="#3f424a"/>
              <stop offset="100%" stop-color="#232529"/>
            </linearGradient>
            <linearGradient id="roadEdge" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#52555e"/>
              <stop offset="100%" stop-color="#27282c"/>
            </linearGradient>
            <linearGradient id="pylonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#f8fafc"/>
              <stop offset="50%" stop-color="#cbd5e1"/>
              <stop offset="100%" stop-color="#94a3b8"/>
            </linearGradient>
            <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#9ca3af"/>
              <stop offset="45%" stop-color="#6b7280"/>
              <stop offset="100%" stop-color="#374151"/>
            </linearGradient>
            <linearGradient id="orangeBrand" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff7722"/>
              <stop offset="100%" stop-color="#e04800"/>
            </linearGradient>
            <radialGradient id="headlightGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fde68a" stop-opacity="0.75"/>
              <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
            </radialGradient>
            <filter id="softDrop" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
            </filter>
          </defs>

          <!-- Background Bridge Deck (Lekki-Ikoyi Link Bridge Curve) -->
          <path d="M 110 175 C 165 130, 255 122, 345 142 L 345 154 C 255 135, 165 144, 110 188 Z" fill="#32353b" />
          <path d="M 115 178 C 168 134, 255 126, 342 145" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.6" />

          <!-- Left Cable-Stayed Pylon -->
          <g>
            <!-- Stay Cables Left -->
            <line x1="154" y1="42" x2="112" y2="174" stroke="#cbd5e1" stroke-width="1.1" opacity="0.65" />
            <line x1="154" y1="56" x2="124" y2="167" stroke="#cbd5e1" stroke-width="1.1" opacity="0.65" />
            <line x1="154" y1="70" x2="136" y2="160" stroke="#cbd5e1" stroke-width="1.1" opacity="0.65" />
            <line x1="154" y1="84" x2="146" y2="154" stroke="#cbd5e1" stroke-width="1.1" opacity="0.65" />
            <!-- Stay Cables Right -->
            <line x1="158" y1="42" x2="212" y2="136" stroke="#cbd5e1" stroke-width="1.1" opacity="0.65" />
            <line x1="158" y1="56" x2="198" y2="139" stroke="#cbd5e1" stroke-width="1.1" opacity="0.65" />
            <line x1="158" y1="70" x2="184" y2="143" stroke="#cbd5e1" stroke-width="1.1" opacity="0.65" />
            <line x1="158" y1="84" x2="170" y2="147" stroke="#cbd5e1" stroke-width="1.1" opacity="0.65" />

            <path d="M 152 34 L 136 168 L 143 168 L 156 54 L 169 164 L 176 164 L 160 34 Z" fill="url(#pylonGrad)" />
            <rect x="145" y="106" width="22" height="5" rx="1" fill="#e2e8f0" />
          </g>

          <!-- Right Cable-Stayed Pylon -->
          <g>
            <line x1="252" y1="54" x2="215" y2="135" stroke="#cbd5e1" stroke-width="1" opacity="0.55" />
            <line x1="252" y1="68" x2="228" y2="134" stroke="#cbd5e1" stroke-width="1" opacity="0.55" />
            <line x1="252" y1="82" x2="240" y2="133" stroke="#cbd5e1" stroke-width="1" opacity="0.55" />
            <line x1="256" y1="54" x2="302" y2="136" stroke="#cbd5e1" stroke-width="1" opacity="0.55" />
            <line x1="256" y1="68" x2="288" y2="135" stroke="#cbd5e1" stroke-width="1" opacity="0.55" />
            <line x1="256" y1="82" x2="274" y2="134" stroke="#cbd5e1" stroke-width="1" opacity="0.55" />
            <path d="M 250 46 L 238 148 L 244 148 L 254 64 L 264 148 L 270 148 L 258 46 Z" fill="url(#pylonGrad)" />
            <rect x="244" y="104" width="20" height="4.5" rx="1" fill="#e2e8f0" />
          </g>

          <!-- Floating 3D Map Location Pins -->
          <!-- Pin 1 (Top Center-Left) -->
          <g class="pin-float-1" transform="translate(205, 86)">
            <path d="M0 -18 C-7 -18 -12 -13 -12 -6 C-12 3 0 14 0 14 C0 14 12 3 12 -6 C12 -13 7 -18 0 -18 Z" fill="#e2e8f0" />
            <circle cx="0" cy="-6" r="4.5" fill="url(#orangeBrand)" />
          </g>
          <!-- Pin 2 (Top Right Small) -->
          <g class="pin-float-2" transform="translate(302, 72)">
            <path d="M0 -14 C-5.5 -14 -9.5 -10 -9.5 -4.5 C-9.5 2.5 0 11 0 11 C0 11 9.5 2.5 9.5 -4.5 C9.5 -10 5.5 -14 0 -14 Z" fill="#cbd5e1" />
            <circle cx="0" cy="-4.5" r="3.5" fill="url(#orangeBrand)" />
          </g>
          <!-- Pin 3 (Right Bridge Side) -->
          <g class="pin-float-3" transform="translate(334, 114)">
            <path d="M0 -20 C-8 -20 -14 -14 -14 -6.5 C-14 3.5 0 16 0 16 C0 16 14 3.5 14 -6.5 C14 -14 8 -20 0 -20 Z" fill="#f1f5f9" />
            <circle cx="0" cy="-6.5" r="5" fill="url(#orangeBrand)" />
          </g>
          <!-- Pin 4 (Left Foreground) -->
          <g class="pin-float-4" transform="translate(46, 206)">
            <path d="M0 -18 C-7 -18 -12 -13 -12 -6 C-12 3 0 14 0 14 C0 14 12 3 12 -6 C12 -13 7 -18 0 -18 Z" fill="#f8fafc" />
            <circle cx="0" cy="-6" r="4.5" fill="url(#orangeBrand)" />
          </g>

          <!-- Foreground Sweeping S-Curve Highway -->
          <g filter="url(#softDrop)">
            <!-- Road Thickness / Curb -->
            <path d="M 32 224 C 125 262, 260 272, 355 256 L 355 264 C 260 280, 125 270, 32 232 Z" fill="url(#roadEdge)" />
            <!-- Main Road Asphalt -->
            <path d="M 32 224 C 110 205, 195 198, 355 232 L 355 256 C 260 272, 125 262, 32 224 Z" fill="url(#roadSurface)" />
            <!-- Animated Center Lane Markings -->
            <path d="M 55 224 C 145 225, 240 236, 345 247" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" class="road-dash-anim" opacity="0.65" />
          </g>

          <!-- Left Tropical Palm Tree -->
          <g class="palm-sway-left">
            <path d="M 42 214 Q 38 175 45 142" fill="none" stroke="#78553a" stroke-width="5.5" stroke-linecap="round" />
            <g transform="translate(45, 142)">
              <path d="M 0 0 C -18 -12 -32 -4 -36 8 C -22 3 -10 2 0 0 Z" fill="#4d7c0f" />
              <path d="M 0 0 C -14 -22 -2 -34 10 -34 C 4 -20 2 -10 0 0 Z" fill="#65a30d" />
              <path d="M 0 0 C 16 -20 32 -12 36 2 C 22 -2 10 -2 0 0 Z" fill="#4d7c0f" />
              <path d="M 0 0 C 18 -4 28 10 26 22 C 16 12 8 6 0 0 Z" fill="#3f6212" />
              <path d="M 0 0 C -16 4 -24 16 -20 26 C -12 16 -6 8 0 0 Z" fill="#3f6212" />
            </g>
          </g>

          <!-- Right Tropical Palm Tree -->
          <g class="palm-sway-right">
            <path d="M 332 238 Q 336 205 328 176" fill="none" stroke="#78553a" stroke-width="5" stroke-linecap="round" />
            <g transform="translate(328, 176)">
              <path d="M 0 0 C -18 -10 -30 -2 -33 10 C -20 4 -9 2 0 0 Z" fill="#4d7c0f" />
              <path d="M 0 0 C -10 -20 4 -30 14 -28 C 7 -16 3 -8 0 0 Z" fill="#65a30d" />
              <path d="M 0 0 C 16 -16 30 -8 33 5 C 20 0 9 -1 0 0 Z" fill="#4d7c0f" />
              <path d="M 0 0 C 16 -2 24 12 21 22 C 12 12 6 6 0 0 Z" fill="#3f6212" />
            </g>
          </g>

          <!-- 3D Ride-Hailing Sedan (Left Foreground) -->
          <g class="car-motion" transform="translate(68, 175)">
            <!-- Ground Shadow -->
            <ellipse cx="64" cy="54" rx="58" ry="12" fill="#000000" opacity="0.55" />
            <!-- Headlight Glow -->
            <ellipse cx="96" cy="44" rx="26" ry="10" fill="url(#headlightGlow)" />
            <!-- Car Lower Chassis -->
            <path d="M 10 34 C 10 24, 24 22, 42 22 L 88 24 C 106 26, 116 32, 116 42 C 116 48, 108 50, 96 50 L 22 48 C 12 48, 10 42, 10 34 Z" fill="url(#carBody)" />
            <!-- Car Cabin Roof -->
            <path d="M 28 23 L 44 10 C 50 7, 74 7, 82 11 L 96 25 Z" fill="#4b5563" />
            <!-- Windshield & Side Windows -->
            <path d="M 46 12 L 78 13 L 90 24 L 44 23 Z" fill="#1e293b" />
            <path d="M 31 22 L 43 13 L 41 23 Z" fill="#1e293b" />
            <!-- Roof Taxi / Droplag Sign -->
            <rect x="55" y="4" width="16" height="6" rx="2.5" fill="url(#orangeBrand)" />
            <!-- Headlights -->
            <ellipse cx="111" cy="37" rx="4.5" ry="2.5" fill="#fef08a" />
            <ellipse cx="88" cy="40" rx="4" ry="2.2" fill="#fef08a" />
            <!-- Front Grille -->
            <path d="M 94 39 L 106 38 L 105 44 L 94 44 Z" fill="#111827" />
            <!-- Wheels -->
            <circle cx="34" cy="48" r="10.5" fill="#111827" stroke="#374151" stroke-width="2" />
            <circle cx="34" cy="48" r="5" fill="#9ca3af" />
            <circle cx="84" cy="50" r="10.5" fill="#111827" stroke="#374151" stroke-width="2" />
            <circle cx="84" cy="50" r="5" fill="#9ca3af" />
          </g>

          <!-- 3D Delivery Rider on Motorcycle (Right Foreground) -->
          <g class="bike-motion" transform="translate(226, 184)">
            <!-- Ground Shadow -->
            <ellipse cx="52" cy="68" rx="44" ry="10" fill="#000000" opacity="0.55" />
            <!-- Rear Delivery Box (Droplag Orange) -->
            <rect x="54" y="14" width="28" height="25" rx="5" fill="url(#orangeBrand)" />
            <rect x="58" y="19" width="20" height="3" rx="1.5" fill="#ffffff" opacity="0.35" />
            <!-- Rider Torso (Orange Jacket) -->
            <path d="M 38 22 C 42 15, 52 16, 54 24 L 52 42 L 36 40 Z" fill="#ff5a00" />
            <!-- Rider Helmet -->
            <circle cx="43" cy="11" r="9.5" fill="#f8fafc" />
            <path d="M 34 10 C 34 6, 41 5, 43 9 L 41 14 L 34 13 Z" fill="#1e293b" />
            <!-- Rider Arm & Leg -->
            <path d="M 42 24 L 27 32" stroke="#ea580c" stroke-width="5.5" stroke-linecap="round" />
            <path d="M 44 40 L 38 56 L 46 58" fill="none" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Motorcycle Frame & Exhaust -->
            <path d="M 22 48 L 46 42 L 74 44 L 82 56 L 30 58 Z" fill="#334155" />
            <path d="M 24 28 L 20 58" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
            <!-- Headlight -->
            <circle cx="19" cy="36" r="3.5" fill="#fef08a" />
            <!-- Motorcycle Wheels -->
            <circle cx="22" cy="59" r="11" fill="#0f172a" stroke="#475569" stroke-width="2.5" />
            <circle cx="22" cy="59" r="5" fill="#cbd5e1" />
            <circle cx="76" cy="58" r="11" fill="#0f172a" stroke="#475569" stroke-width="2.5" />
            <circle cx="76" cy="58" r="5" fill="#cbd5e1" />
          </g>
        </svg>
      </div>

      <!-- 3. Editorial Headline, Subcopy & Carousel Indicators -->
      <div class="anim-copy text-center px-2 mb-6 relative z-10">
        <div id="slide-text-container" class="text-transition">
          <h1 id="slide-title" class="text-[28px] font-extrabold text-white leading-[1.16] tracking-tight">
            Moving Lagos<br />Forward
          </h1>
          <p id="slide-subtitle" class="text-[13.5px] text-[#9ca3af] font-normal leading-relaxed mt-2.5 max-w-[265px] mx-auto">
            Your reliable rides and instant package delivery across the city
          </p>
        </div>

        <!-- Interactive Carousel Dots -->
        <div class="flex items-center justify-center gap-2 mt-5">
          <button onclick="goToSlide(0)" aria-label="Slide 1" id="dot-0" class="h-1.5 w-5 rounded-full bg-[#ff5a00] transition-all duration-300"></button>
          <button onclick="goToSlide(1)" aria-label="Slide 2" id="dot-1" class="h-1.5 w-1.5 rounded-full bg-white/30 hover:bg-white/60 transition-all duration-300"></button>
          <button onclick="goToSlide(2)" aria-label="Slide 3" id="dot-2" class="h-1.5 w-1.5 rounded-full bg-white/30 hover:bg-white/60 transition-all duration-300"></button>
        </div>
      </div>

      <!-- 4. Primary & Secondary CTAs -->
      <div class="anim-cta space-y-3 relative z-10">
        <button onclick="openAuthSheet('signup')" class="w-full py-4 rounded-2xl bg-[#ff5a00] hover:bg-[#ff6b1a] active:scale-[0.98] text-black font-bold text-[15px] tracking-tight shadow-[0_10px_28px_rgba(255,90,0,0.32)] transition">
          Get Started
        </button>

        <button onclick="openAuthSheet('login')" class="w-full py-2.5 text-center text-[14px] font-bold text-white hover:text-[#ff5a00] transition">
          Log In
        </button>
      </div>
    </div>

    <!-- ==================== INTERACTIVE AUTH OVERLAY (GET STARTED / LOG IN) ==================== -->
    <div id="auth-overlay" class="hidden absolute inset-0 bg-[#111111]/95 backdrop-blur-md z-30 flex flex-col justify-between p-6 pt-12">
      <div>
        <div class="flex items-center justify-between mb-8">
          <button onclick="closeAuthSheet()" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/15 flex items-center justify-center text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <div class="droplag-logo text-2xl">
            <span class="text-white">Drop</span><span class="text-[#ff5a00]">lag</span>
          </div>
          <div class="w-10"></div>
        </div>

        <h2 id="auth-heading" class="text-2xl font-extrabold text-white tracking-tight">Create your account</h2>
        <p id="auth-sub" class="text-xs text-neutral-400 mt-1 mb-6">Enter your Nigerian phone number to continue</p>

        <div class="space-y-3.5">
          <div class="flex items-center gap-2.5 bg-white/5 border border-white/15 focus-within:border-[#ff5a00] rounded-2xl px-4 py-3.5 transition">
            <span class="text-sm font-bold text-white">🇳🇬 +234</span>
            <span class="w-[1px] h-5 bg-white/15"></span>
            <input id="phone-input" type="tel" placeholder="803 000 0000" class="w-full bg-transparent text-sm font-semibold text-white placeholder-neutral-500 outline-none" />
          </div>

          <button onclick="submitAuth()" class="w-full py-4 rounded-2xl bg-[#ff5a00] hover:bg-[#ff6b1a] text-black font-bold text-sm shadow-lg shadow-[#ff5a00]/25 transition">
            Continue
          </button>
        </div>
      </div>

      <p class="text-[11px] text-center text-neutral-500 leading-relaxed">
        By continuing, you agree to Droplag's <span class="text-neutral-300 underline">Terms of Service</span> & <span class="text-neutral-300 underline">Privacy Policy</span>.
      </p>
    </div>

    <!-- Toast Feedback -->
    <div id="toast" class="hidden absolute top-14 left-1/2 -translate-x-1/2 bg-white text-black text-xs font-bold px-4 py-2.5 rounded-full shadow-2xl z-50 whitespace-nowrap"></div>

    <!-- Bottom Home Indicator Bar -->
    <div class="pb-2 pt-1 flex justify-center bg-[#111111]">
      <div class="w-32 h-1 rounded-full bg-white/25"></div>
    </div>
  </div>

  <script>
    const SLIDES = [
      {
        title: "Moving Lagos<br />Forward",
        subtitle: "Your reliable rides and instant package delivery across the city"
      },
      {
        title: "Express Dispatch<br />Across Mainland & Island",
        subtitle: "Track your courier live from Lekki to Ikeja with zero delays"
      },
      {
        title: "Safe Rides,<br />Upfront Naira Fares",
        subtitle: "Verified drivers, transparent pricing, and 24/7 trip support"
      }
    ];

    let currentSlide = 0;
    let autoSlideTimer = null;

    function startAutoCarousel() {
      clearInterval(autoSlideTimer);
      autoSlideTimer = setInterval(() => {
        goToSlide((currentSlide + 1) % SLIDES.length, false);
      }, 4500);
    }

    function goToSlide(index, resetTimer = true) {
      currentSlide = index;
      const container = document.getElementById('slide-text-container');
      container.style.opacity = '0';
      container.style.transform = 'translateY(6px)';

      setTimeout(() => {
        document.getElementById('slide-title').innerHTML = SLIDES[index].title;
        document.getElementById('slide-subtitle').textContent = SLIDES[index].subtitle;
        container.style.opacity = '1';
        container.style.transform = 'translateY(0)';
      }, 180);

      SLIDES.forEach((_, i) => {
        const dot = document.getElementById(`dot-${i}`);
        if (i === index) {
          dot.className = 'h-1.5 w-5 rounded-full bg-[#ff5a00] transition-all duration-300';
        } else {
          dot.className = 'h-1.5 w-1.5 rounded-full bg-white/30 hover:bg-white/60 transition-all duration-300';
        }
      });

      if (resetTimer) startAutoCarousel();
    }

    function replayIntroAnimation() {
      const animatedEls = document.querySelectorAll('.anim-logo, .anim-scene, .anim-copy, .anim-cta');
      animatedEls.forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight; // force reflow
        el.style.animation = '';
      });
      goToSlide(0, true);
    }

    function openAuthSheet(mode) {
      const overlay = document.getElementById('auth-overlay');
      document.getElementById('auth-heading').textContent =
        mode === 'signup' ? 'Create your account' : 'Welcome back to Droplag';
      document.getElementById('auth-sub').textContent =
        mode === 'signup'
          ? 'Enter your Nigerian phone number to get started'
          : 'Log in with your registered mobile number';
      overlay.classList.remove('hidden');
      setTimeout(() => document.getElementById('phone-input').focus(), 60);
    }

    function closeAuthSheet() {
      document.getElementById('auth-overlay').classList.add('hidden');
    }

    function submitAuth() {
      const phone = document.getElementById('phone-input').value.trim();
      if (!phone) {
        showToast('Please enter your phone number');
        return;
      }
      closeAuthSheet();
      showToast(`OTP sent to +234 ${phone}`);
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add('hidden'), 2600);
    }

    // Start carousel after initial entrance animation settles
    setTimeout(startAutoCarousel, 1800);
  </script>
</body>
</html>
